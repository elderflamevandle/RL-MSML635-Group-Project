# Walking-skeleton GRPO config. Smallest workable configuration.
# Server-only — do not try to run locally.
# NOTE: Field names come from the GRACE paper's reference `verl` config.
# When actually run on the server, verl will almost certainly complain about
# field mismatches — the Week-1 walking-skeleton task includes iterating on
# this until it runs. Our job here is just to put the file in place.
_meta:
  reward: r0
  optimizer: grpo
  model: qwen3-0.6b
  seed: 0

trainer:
  project_name: rl-rag-skeleton
  experiment_name: skeleton
  n_gpus_per_node: 1
  nnodes: 1
  total_training_steps: 1
  save_freq: 1

data:
  train_files: data/raw/hotpot_tiny.jsonl
  val_files: data/raw/hotpot_tiny.jsonl
  prompt_key: prompt
  max_prompt_length: 2048
  max_response_length: 512
  train_batch_size: 4

actor_rollout_ref:
  model:
    path: Qwen/Qwen3-0.6B
    enable_lora: true
    lora_rank: 16
  rollout:
    name: vllm
    gpu_memory_utilization: 0.6
    n: 4

algorithm:
  name: grpo
  kl_coef: 0.001

reward_fn:
  path: src.rewards.r0_grace:r0_grace
