# T4-tuned walking skeleton. 1-step GRPO run to smoke-test the full stack.
# Use this instead of configs/skeleton.yaml on a 16 GB Colab T4.
#
# Differences vs. configs/skeleton.yaml:
#   - gpu_memory_utilization 0.5 (vLLM shares VRAM with trainer activations)
#   - n = 2 rollouts (fits group-advantage math; cheap smoke test)
#   - max_prompt_length / max_response_length trimmed for KV-cache headroom
_meta:
  reward: r0
  optimizer: grpo
  model: qwen3-0.6b
  seed: 0

trainer:
  project_name: rl-rag-skeleton
  experiment_name: skeleton_t4
  n_gpus_per_node: 1
  nnodes: 1
  total_training_steps: 1
  save_freq: 1

data:
  train_files: data/raw/hotpot_tiny.jsonl
  val_files: data/raw/hotpot_tiny.jsonl
  prompt_key: prompt
  max_prompt_length: 1536
  max_response_length: 384
  train_batch_size: 2

actor_rollout_ref:
  model:
    path: Qwen/Qwen3-0.6B
    enable_lora: true
    lora_rank: 16
  rollout:
    name: vllm
    gpu_memory_utilization: 0.5
    n: 2

algorithm:
  name: grpo
  kl_coef: 0.001

reward_fn:
  path: src.rewards.r0_grace:r0_grace
