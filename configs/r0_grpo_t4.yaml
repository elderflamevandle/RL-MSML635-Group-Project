# T4-tuned R0 + GRPO. For 16 GB Colab T4, LoRA, fp16.
#
# Differences vs. configs/r0_grpo.yaml:
#   - gpu_memory_utilization 0.5 (vLLM + trainer must coexist on 16 GB)
#   - train_batch_size 16 (was 32) and ppo_mini_batch_size 8 (was 16)
#   - n = 4 rollouts per group (was 8) — group-advantage still works
#   - max_prompt_length / max_response_length trimmed
#   - total_training_steps 200 + save_freq 25 so a Colab session disconnect
#     loses at most ~25 steps; `trainer.resume_mode: auto` picks up where
#     the last checkpoint left off.
#   - data points at BM25 cache (already committed in data/cache/); switch
#     to dense_train/dense_val after scripts/build_retrieval.py has run.
# Extends verl's base PPO/GRPO config via Hydra composition.
# launch_run.sh adds verl's config dir to Hydra's search path.
defaults:
  - ppo_trainer
  - _self_

_meta:
  reward: r0
  optimizer: grpo
  model: qwen3-0.6b
  seed: 0

trainer:
  project_name: rl-rag-t4
  experiment_name: r0_grpo_qwen3-0.6b_t4
  n_gpus_per_node: 1
  nnodes: 1
  total_epochs: 1
  total_training_steps: 200
  save_freq: 25
  resume_mode: auto
  logger: [console]
  val_before_train: false

data:
  train_files: data/cache/bm25_train.jsonl
  val_files:   data/cache/bm25_val.jsonl
  prompt_key: prompt
  max_prompt_length: 1536
  max_response_length: 384
  train_batch_size: 16

actor_rollout_ref:
  model:
    path: Qwen/Qwen3-0.6B
    enable_lora: true
    lora_rank: 16
    lora_alpha: 32
  rollout:
    name: vllm
    gpu_memory_utilization: 0.5
    n: 4
    temperature: 0.9
    dtype: float16
    tensor_model_parallel_size: 1
  actor:
    optim:
      lr: 1.0e-5
    ppo_mini_batch_size: 8

algorithm:
  name: grpo
  kl_coef: 0.001
  advantage_normalization: true

reward_fn:
  path: src.rewards.r0_grace:r0_grace
