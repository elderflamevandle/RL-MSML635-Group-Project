# T4-tuned R0 + GRPO (16 GB Colab T4, LoRA, fp16 rollouts).
# Schema verified against verl @ 4aa02fe -- see configs/skeleton_t4.yaml for
# the list of field renames.
#
# Sizing: 16 prompts x 4 rollouts = 64 sequences per step, 200 steps.
# save_freq 25 + resume_mode auto: a disconnect costs at most 25 steps
# (launch_run.sh reuses the newest unfinished run dir so resume really works).
defaults:
  - ppo_trainer
  - _self_

# Stripped by launch_run.sh before verl sees the file (verl's schema is strict).
_meta:
  reward: r0
  optimizer: grpo
  model: qwen3-0.6b
  seed: 0

trainer:
  project_name: rl-rag-t4
  experiment_name: r0_grpo_qwen3-0.6b_t4
  n_gpus_per_node: 1
  nnodes: 1
  total_epochs: 2
  total_training_steps: 200
  save_freq: 25
  test_freq: -1
  resume_mode: auto
  logger: [console]
  val_before_train: false

data:
  train_files: data/cache/bm25_train.parquet
  val_files: data/cache/bm25_val.parquet
  prompt_key: prompt
  max_prompt_length: 1536
  max_response_length: 384
  train_batch_size: 16
  filter_overlong_prompts: true
  truncation: left
  dataloader_num_workers: 2

actor_rollout_ref:
  model:
    path: Qwen/Qwen3-0.6B
    lora_rank: 16
    lora_alpha: 32
    custom_chat_template: "{{ messages[0]['content'] }}"
  actor:
    ppo_mini_batch_size: 8
    ppo_micro_batch_size_per_gpu: 4
    use_kl_loss: true
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    use_torch_compile: false
    optim:
      lr: 1.0e-5
  ref:
    log_prob_micro_batch_size_per_gpu: 8
  rollout:
    name: vllm
    mode: sync
    n: 4
    temperature: 0.9
    dtype: float16
    gpu_memory_utilization: 0.5
    tensor_model_parallel_size: 1
    max_num_batched_tokens: 8192
    max_num_seqs: 64
    log_prob_micro_batch_size_per_gpu: 8

algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: true
  use_kl_in_reward: false

custom_reward_function:
  path: src/rewards/verl_adapter.py
  name: r0_score
