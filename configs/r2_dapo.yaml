# R2 (hard-gated multiplicative) + DAPO on HotpotQA. Server-only.
_meta:
  reward: r2
  optimizer: dapo
  model: qwen3-0.6b
  seed: 0

trainer:
  project_name: rl-rag
  experiment_name: r2_dapo_qwen3-0.6b
  n_gpus_per_node: 1
  nnodes: 1
  total_training_steps: 400
  save_freq: 100
  logger: [console]

data:
  train_files: data/cache/dense_train.jsonl
  val_files:   data/cache/dense_val.jsonl
  prompt_key: prompt
  max_prompt_length: 2048
  max_response_length: 512
  train_batch_size: 32

actor_rollout_ref:
  model:
    path: Qwen/Qwen3-0.6B
    enable_lora: true
    lora_rank: 16
    lora_alpha: 32
  rollout:
    name: vllm
    gpu_memory_utilization: 0.6
    n: 8
    temperature: 0.9
  actor:
    optim:
      lr: 1.0e-5
    ppo_mini_batch_size: 16

algorithm:
  name: dapo
  kl_coef: 0.001
  advantage_normalization: true
  clip_ratio_low: 0.2
  clip_ratio_high: 0.28
  dynamic_sampling: true

reward_fn:
  path: src.rewards.r2_hard_gated:r2_hard_gated
