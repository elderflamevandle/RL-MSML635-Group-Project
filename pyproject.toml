[project]
name = "rl-rag"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # HF stack upper bounds locked together: HF 1.0 / datasets 5.x / sentence-transformers 5+ /
    # transformers 5.x all require torch>=2.6 (torch.accelerator API). We're on torch 2.5.x
    # (CUDA 12.1 wheel), so pin to the last pre-rebrand majors that work with huggingface-hub 0.x.
    "datasets>=2.20,<5",
    "transformers>=4.44,<5",
    "sentence-transformers>=3.0,<5",
    "rank-bm25>=0.2.2",
    "rouge-score>=0.1.2",
    "bert-score>=0.3.13",
    "torch>=2.3",
    "numpy",
    "pydantic>=2",
    "pyyaml",
    "requests",
    "tenacity",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "ruff", "mypy"]
train = ["vllm", "accelerate", "peft", "wandb"]  # heavy; install on server only

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
